<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Door Hardware Quote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%AA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Door Quote">
<style>
  :root{
    --bg:#0f1220; --panel:#191d31; --panel2:#212642; --line:#2c3355;
    --text:#e8eaf6; --muted:#9aa3c7; --accent:#6c8cff; --accent2:#4cc9a0;
    --danger:#ff6b6b; --shadow:0 12px 40px rgba(0,0,0,.45);
    --inbg:#0f1326; --faint:var(--faint); --glow1:#1b2140; --glow2:#152033;
    --scale:1;
  }
  :root[data-theme="light"]{
    --bg:#eef0f6; --panel:#ffffff; --panel2:#f3f5fb; --line:#d7dcea;
    --text:#1a1f2e; --muted:#5c6784; --accent:#4c68e0; --accent2:#1f9e78;
    --danger:#d64545; --shadow:0 12px 32px rgba(40,55,90,.15);
    --inbg:#ffffff; --faint:#8b95b3; --glow1:#dfe6fb; --glow2:#e3ecf6;
  }
  *{box-sizing:border-box}
  html{zoom:var(--scale)}                 /* text/UI size control */
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,var(--glow1) 0,transparent 60%),
    radial-gradient(900px 500px at -10% 110%,var(--glow2) 0,transparent 55%),var(--bg);
    color:var(--text);min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--inbg);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type=number]{-moz-appearance:textfield}
  .hidden{display:none!important}
  .sr-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}

  #app{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
  header.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  header.top .brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  header.top .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2)}
  .grow{flex:1}
  .btn{background:var(--panel2);color:var(--text);padding:10px 14px;border:1px solid var(--line);font-size:14px}
  .btn:hover{border-color:var(--accent)}
  .btn.accent{background:linear-gradient(135deg,var(--accent),#8b6cff);border:none;color:#fff;font-weight:600}
  .btn.small{padding:8px 11px;font-size:13px}
  .viewgroup{display:inline-flex;gap:6px}
  .btn.iconbtn{padding:9px 11px;min-width:40px;font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .panel h2{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel h2 .grow{font-size:15px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}

  /* quote line table */
  table.lines{width:100%;border-collapse:collapse}
  table.lines th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    text-align:left;padding:6px 8px;font-weight:600}
  table.lines th.num,table.lines td.num{text-align:right}
  table.lines td{padding:5px 6px;vertical-align:middle;border-top:1px solid var(--line)}
  table.lines input{padding:8px 9px}
  .qtyc{width:64px}.unitc{width:100px}.codec{width:90px}.stocksel{width:74px;padding:8px 6px}
  .stock-print{display:none}
  .linetot{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
  .unit-print{display:none;font-variant-numeric:tabular-nums}
  .rmbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .rmbtn:hover{color:var(--danger);border-color:var(--danger)}
  .emptyrow td{color:var(--muted);text-align:center;padding:22px;font-size:14px}

  .totals{margin-top:14px;margin-left:auto;max-width:320px}
  .totline{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--muted)}
  .totline.grand{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:20px;font-weight:800;color:var(--text)}
  .totline .v{font-variant-numeric:tabular-nums;color:var(--text)}
  .delivrow{display:flex;align-items:center;gap:8px}
  .delivrow input{width:110px}
  .vatlbl{display:flex;align-items:center;gap:6px}
  .vattoggle{display:flex;align-items:center;gap:6px;cursor:pointer}
  .vattoggle input{width:auto}
  .vatrate{width:56px;padding:6px 8px;text-align:right}
  .addrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .addrow select{flex:1;min-width:160px}

  /* catalogue */
  .catlist{display:flex;flex-direction:column;gap:8px}
  .catrow{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px}
  .catrow .cdesc{flex:1;min-width:0}
  .catrow .cdesc .n{font-weight:600}
  .catrow .cdesc .s{font-size:12px;color:var(--muted)}
  .catrow .cunit{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .star{background:none;border:none;font-size:18px;line-height:1;padding:2px;color:var(--faint)}
  .star.on{color:#ffd43b}
  .icon{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .icon:hover{color:var(--text);border-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:30px 20px}
  .stdtag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;
    letter-spacing:.5px;background:rgba(255,212,59,.16);color:#ffd43b}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(6,8,18,.7);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:24px;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
  .modal h2{margin:0 0 18px;font-size:18px}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .primary{background:linear-gradient(135deg,var(--accent),#8b6cff);color:#fff;padding:12px;font-size:15px;font-weight:600}
  .primary:hover{filter:brightness(1.08)}
  .primary.flex1{flex:1}
  .link{background:none;color:var(--muted);padding:12px;font-size:14px}
  .link:hover{color:var(--text)}
  .link.danger:hover{color:var(--danger)}
  .cbrow{display:flex;align-items:center;gap:8px}
  .cbrow input{width:auto}
  .pwrow{display:flex;gap:8px;align-items:stretch}
  .logorow{display:flex;gap:12px;align-items:center}
  .logobox{width:120px;height:70px;border:1px solid var(--line);border-radius:10px;background:var(--inbg);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .logobox img{max-width:100%;max-height:100%}
  .logobox .ph{color:var(--faint);font-size:12px}
  .logobtns{display:flex;flex-direction:column;gap:8px}
  .tlink{color:var(--accent);text-decoration:none;font-weight:600}
  .tlink:hover{text-decoration:underline}
  .err{color:var(--danger);font-size:13px;min-height:18px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:11px 20px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);
    z-index:99;opacity:0;transition:.25s;pointer-events:none;display:inline-flex;align-items:center;gap:16px;
    max-width:calc(100vw - 32px)}
  .toast.show{opacity:1}
  .ver{color:var(--faint);font-size:10px;text-align:center;margin-top:14px;letter-spacing:.3px}

  @media (max-width:560px){
    #app{padding:16px 12px 50px}
    .grid2{grid-template-columns:1fr}
    header.top{gap:8px}
    .btn{padding:9px 11px;font-size:13px}
    table.lines th.hidesm,table.lines td.hidesm{display:none}
    .qtyc{width:56px}.unitc{width:84px}
  }

  /* ---------- print ---------- */
  @media print{
    @page{margin:14mm}
    html{zoom:1!important}                     /* text-size control never affects the PDF */
    body{background:#fff!important;color:#000!important;font-size:12px}
    #app{max-width:none;padding:0}
    .noprint{display:none!important}
    .panel{border:none;background:none;padding:0;margin:0 0 16px}
    .panel h2{display:none!important}          /* drop the emoji section headings */
    .ver{display:none!important}               /* drop the build-version footer */
    #printHead{display:block!important}
    table.lines{border-collapse:collapse}
    table.lines th{color:#555;border-bottom:1.5px solid #1f4e79;padding:4px 8px;font-size:9.5px}
    table.lines td{border-top:1px solid #e2e2e2;padding:7px 8px}
    table.lines tr{page-break-inside:avoid}
    table.lines input{border:none;background:none;color:#000;padding:0;-webkit-appearance:none;appearance:none}
    td.num input{text-align:right}
    .stocksel{display:none!important}
    .stock-print{display:inline!important}
    .qtyc,.unitc{width:auto}
    .unitc{display:none!important}             /* show the formatted £ value instead */
    .unit-print{display:inline!important}
    .rmbtn,.addrow{display:none!important}
    .linetot{font-weight:600}
    .totals{max-width:300px;margin-top:10px}
    .totline{color:#000;padding:5px 0}
    .totline .v{color:#000!important}
    .totline.grand{border-top:2px solid #1f4e79;color:#000;font-size:17px}
    .totline.grand .v{color:#1f4e79!important}
    .totline.vatoff{display:none!important}
    /* swap live inputs for static text in the totals */
    #qDelivery{display:none!important}
    #tDelivPrint{display:inline!important}
    .vattoggle{display:none!important}
    .vatlbl-print,.vatrate-print{display:inline!important}
    #printFoot{display:block!important}
    #printTerms{display:block!important}
  }
  #printHead{display:none;margin-bottom:22px;color:#111}
  #printHead .phtop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  #printHead .col-logo{max-height:64px;max-width:200px;margin-bottom:10px;display:block}
  #printHead .co{font-size:20px;font-weight:800}
  #printHead .coaddr{font-size:11.5px;color:#555;margin-top:4px;white-space:pre-line;line-height:1.55}
  #printHead .qtitle{font-size:24px;font-weight:800;letter-spacing:2px;color:#1f4e79}
  #printHead .qmeta{display:flex;justify-content:space-between;gap:24px;margin-top:16px;
    border-top:2px solid #1f4e79;padding-top:12px}
  #printHead .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#888;font-weight:700}
  #printHead .qfor .cust{font-size:15px;font-weight:700;margin-top:2px}
  #printHead .qfor .proj{font-size:12px;color:#555;margin-top:2px}
  #printHead .qnums{text-align:right;white-space:nowrap}
  #printHead .qnums > div{margin-bottom:6px}
  #printHead .qnums .lbl{display:block}
  #printHead .qnums b{font-size:15px}
  #printTerms{display:none;margin-top:24px;padding-top:12px;border-top:1px solid #ddd;
    font-size:9.5px;color:#555;line-height:1.5;page-break-inside:avoid}
  #printTerms h4{margin:0 0 6px;font-size:10.5px;color:#1f4e79;text-transform:uppercase;letter-spacing:.5px}
  #printTerms ul{margin:0;padding-left:15px}
  #printTerms li{margin-bottom:3px}
  #printFoot{display:none;margin-top:18px;padding-top:12px;border-top:1px solid #ddd;
    font-size:10.5px;color:#777;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="top noprint">
    <div class="brand"><span class="dot"></span> 🚪 Quote Builder</div>
    <div class="grow"></div>
    <button class="btn" id="stdBtn" title="Add all standard-setup items to this quote">⭐ Standard setup</button>
    <button class="btn" id="catBtn" title="Manage your hardware catalogue">🧰 Catalogue</button>
    <button class="btn" id="coBtn" title="Your company details (shown on the printed quote)">🏢 Company</button>
    <button class="btn" id="syncBtn" title="Sync your catalogue & quotes across devices">☁ Sync</button>
    <button class="btn" id="quotesBtn" title="Open a saved quote">📁 Quotes</button>
    <button class="btn accent" id="saveBtn" title="Save this quote to your library">💾 Save</button>
    <button class="btn" id="printBtn" title="Print or save as PDF">🖨 Print / PDF</button>
    <button class="btn" id="emailBtn" title="Open your email app with this quote pre-filled">✉ Email</button>
    <button class="btn" id="exportBtn" title="Download a backup">⬇ Backup</button>
    <button class="btn" id="importBtn" title="Restore a backup">⬆ Restore</button>
    <button class="btn" id="newBtn" title="Start a fresh quote">✚ New quote</button>
    <span class="viewgroup">
      <button class="btn iconbtn" id="tsDown" title="Smaller text">A−</button>
      <button class="btn iconbtn" id="tsUp" title="Larger text">A+</button>
      <button class="btn iconbtn" id="themeBtn" title="Light / dark theme">🌙</button>
    </span>
    <input type="file" id="importFile" accept=".json,application/json" class="sr-file">
  </header>

  <!-- print header (only visible when printing) -->
  <div id="printHead">
    <div class="phtop">
      <div>
        <img id="phLogo" class="col-logo" alt="" style="display:none">
        <div class="co" id="phCo"></div>
        <div class="coaddr" id="phAddr"></div>
      </div>
      <div class="qtitle">QUOTATION</div>
    </div>
    <div class="qmeta">
      <div class="qfor">
        <div class="lbl">Quote for</div>
        <div class="cust" id="phCust"></div>
        <div class="proj" id="phProj"></div>
        <div class="proj" id="phCustEmail"></div>
      </div>
      <div class="qnums">
        <div><span class="lbl">Quote No</span><b id="phRef"></b></div>
        <div><span class="lbl">Date</span><b id="phDate"></b></div>
      </div>
    </div>
  </div>

  <!-- quote details (screen only; the printed quote uses the header block above) -->
  <div class="panel noprint">
    <h2>📋 Quote details</h2>
    <div class="grid2">
      <div class="field"><label>Customer / Company</label><input id="qCustomer" placeholder="Customer name"></div>
      <div class="field"><label>Quote reference</label><input id="qRef" placeholder="e.g. Q-1042"></div>
      <div class="field"><label>Customer email <span style="color:var(--faint);font-weight:400">— for the Email button</span></label><input id="qEmail" type="email" placeholder="customer@example.com"></div>
      <div class="field"><label>Project / Site</label><input id="qProject" placeholder="e.g. Door set — Level 2"></div>
      <div class="field"><label>Date</label><input id="qDate" type="date"></div>
    </div>
  </div>

  <!-- line items -->
  <div class="panel">
    <h2>🔩 Line items</h2>
    <table class="lines">
      <thead>
        <tr>
          <th class="num" style="width:64px">Qty</th>
          <th class="noprint" style="width:96px">Code</th>
          <th>Description</th>
          <th style="width:82px">In stock</th>
          <th class="num" style="width:100px">Unit cost</th>
          <th class="num" style="width:110px">Line total</th>
          <th class="noprint" style="width:36px"></th>
        </tr>
      </thead>
      <tbody id="lineBody"></tbody>
    </table>

    <div class="addrow noprint">
      <select id="catPick"><option value="">➕ Add from catalogue…</option></select>
      <button class="btn" id="addBlankBtn">➕ Blank line</button>
    </div>

    <div class="totals">
      <div class="totline"><span>Subtotal</span><span class="v" id="tSub">£0.00</span></div>
      <div class="totline">
        <span>Delivery charge</span>
        <span class="delivrow"><span>£</span><input id="qDelivery" type="number" min="0" step="0.01" value="0" class="noprint"><span class="v hidden" id="tDelivPrint">£0.00</span></span>
      </div>
      <div class="totline" id="vatLine">
        <span class="vatlbl">
          <label class="vattoggle noprint"><input type="checkbox" id="qVatOn" checked> VAT</label>
          <span class="vatlbl-print hidden">VAT</span>
          @ <input id="qVatRate" type="number" min="0" step="0.1" value="20" class="vatrate noprint"><span class="vatrate-print hidden">20</span>%
        </span>
        <span class="v" id="tVat">£0.00</span>
      </div>
      <div class="totline grand"><span>Total</span><span class="v" id="tGrand">£0.00</span></div>
    </div>

    <div id="printTerms"></div>
    <div id="printFoot"></div>
  </div>

  <div class="ver" id="ver"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Door Hardware Quote — single-file PWA (cloned from Vault)
   Storage: localStorage
     dhq.catalogue.v1 = [{id,desc,unit,standard}]
     dhq.quote.v1     = {customer,ref,project,date,delivery,lines:[{id,qty,desc,unit}]}
============================================================ */
const LS_CAT = "dhq.catalogue.v1";
const LS_QUOTE = "dhq.quote.v1";
const LS_QUOTES = "dhq.quotes.v1";
const LS_CO = "dhq.company.v1";
const LS_SEQ = "dhq.seq.v1";
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "£" + (Number(n)||0).toFixed(2);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Date.now()+Math.random());

// Terms & conditions shown at the bottom of the printed quote and the email.
const TERMS = [
  "Prices exclude VAT.",
  "Lead times are based on current stock levels, subject to availability at the time of quotation.",
  "We accept no responsibility for late deliveries, for inaccurate delivery addresses supplied by yourselves, or for the courier failing to make contact with the recipient or to leave packages/cards.",
  "Missing or damaged items must be reported within 5 days of delivery.",
  "To proceed, please send us an official purchase order.",
  "Please note: if your account is on a proforma basis, we will require payment before the parts can be sent out or placed on order with our supplier.",
  "Once your purchase order has been received, we will send you instructions on how to pay."
];

let catalogue = [];      // hardware items you maintain
let quote = null;        // current working quote
let savedQuotes = [];    // your saved quote library
let company = null;      // your company details (shown on print)
let nextSeq = 1001;      // next auto quote number (synced by max)

/* ---------- persistence ---------- */
function loadAll(){
  try{ catalogue = JSON.parse(localStorage.getItem(LS_CAT)) || []; }catch{ catalogue = []; }
  if(!Array.isArray(catalogue)) catalogue = [];
  try{ quote = JSON.parse(localStorage.getItem(LS_QUOTE)); }catch{ quote = null; }
  if(!quote || typeof quote !== "object") quote = blankQuote();
  fixQuote(quote);
  try{ savedQuotes = JSON.parse(localStorage.getItem(LS_QUOTES)) || []; }catch{ savedQuotes = []; }
  if(!Array.isArray(savedQuotes)) savedQuotes = [];
  try{ company = JSON.parse(localStorage.getItem(LS_CO)); }catch{ company = null; }
  if(!company || typeof company !== "object") company = {name:"",address:"",contact:"",vatNo:""};
  if(typeof company.quotePrefix !== "string") company.quotePrefix = "Q-";
  if(typeof company.defaultDelivery !== "number") company.defaultDelivery = 30;
  let s; try{ s = parseInt(localStorage.getItem(LS_SEQ),10); }catch{ s = NaN; }
  nextSeq = Number.isFinite(s) && s>0 ? s : 1001;
}
function saveSeq(){ try{ localStorage.setItem(LS_SEQ, String(nextSeq)); }catch(e){} }
const previewRef = () => (company.quotePrefix||"") + nextSeq;
function fixQuote(q){
  if(!Array.isArray(q.lines)) q.lines = [];
  if(typeof q.vatRate !== "number") q.vatRate = 20;
  if(typeof q.vatOn !== "boolean") q.vatOn = true;
  if(typeof q.email !== "string") q.email = "";
  if(!("savedId" in q)) q.savedId = null;
  return q;
}
function blankQuote(){
  const deliv = (company && Number.isFinite(company.defaultDelivery)) ? company.defaultDelivery : 30;
  return { customer:"", ref:"", email:"", project:"", date:new Date().toISOString().slice(0,10),
           delivery:deliv, vatRate:(quote?quote.vatRate:20), vatOn:(quote?quote.vatOn:true),
           lines:[], savedId:null };
}
function _putCat(){ try{ localStorage.setItem(LS_CAT, JSON.stringify(catalogue)); }catch(e){ toast("⚠ Save failed"); } }
function _putQuotes(){ try{ localStorage.setItem(LS_QUOTES, JSON.stringify(savedQuotes)); }catch(e){ toast("⚠ Save failed"); } }
function _putCo(){ try{ localStorage.setItem(LS_CO, JSON.stringify(company)); }catch(e){ toast("⚠ Save failed"); } }
// public savers also queue a cloud push; background merges use the _put* forms directly
function saveCat(){ _putCat(); schedulePush(); }
function saveQuote(){ try{ localStorage.setItem(LS_QUOTE, JSON.stringify(quote)); }catch(e){ toast("⚠ Save failed"); } }
function saveQuotes(){ _putQuotes(); schedulePush(); }

/* ---------- totals (reusable) ---------- */
function computeTotals(q){
  const sub = q.lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.unit)||0),0);
  const deliv = Number(q.delivery)||0;
  const net = sub + deliv;
  const rate = q.vatOn ? (Number(q.vatRate)||0) : 0;
  const vat = net * rate / 100;
  return { sub, deliv, net, vat, grand: net + vat };
}

/* ---------- quote fields ---------- */
function bindQuoteFields(){
  $("qCustomer").value = quote.customer||"";
  $("qRef").value = quote.ref||"";
  $("qEmail").value = quote.email||"";
  $("qProject").value = quote.project||"";
  $("qDate").value = quote.date||"";
  $("qDelivery").value = quote.delivery||0;
  const map = {qCustomer:"customer",qRef:"ref",qEmail:"email",qProject:"project",qDate:"date"};
  Object.entries(map).forEach(([el,key])=>{
    $(el).oninput = e=>{ quote[key]=e.target.value; saveQuote(); };
  });
  $("qDelivery").oninput = e=>{ quote.delivery = parseFloat(e.target.value)||0; saveQuote(); renderTotals(); };
  $("qVatOn").checked = quote.vatOn;
  $("qVatRate").value = quote.vatRate;
  $("qVatOn").onchange = e=>{ quote.vatOn = e.target.checked; saveQuote(); renderTotals(); };
  $("qVatRate").oninput = e=>{ quote.vatRate = parseFloat(e.target.value)||0; saveQuote(); renderTotals(); };
}

/* ---------- line items ---------- */
function renderLines(){
  const body = $("lineBody");
  if(!quote.lines.length){
    body.innerHTML = `<tr class="emptyrow"><td colspan="5">No items yet — add from your catalogue, click ⭐ Standard setup, or add a blank line.</td></tr>`;
    renderTotals(); return;
  }
  body.innerHTML = quote.lines.map(l=>`
    <tr data-id="${l.id}">
      <td class="num"><input class="qtyc" type="number" min="0" step="1" value="${l.qty}" data-f="qty"></td>
      <td class="codecol noprint"><input class="codec" type="text" value="${esc(l.code||'')}" data-f="code" placeholder="Code"></td>
      <td><input type="text" value="${esc(l.desc)}" data-f="desc" placeholder="Description"></td>
      <td>${(()=>{const st=(l.stock==='no')?'no':'yes';return `<select class="stocksel noprint" data-f="stock"><option value="yes"${st==='yes'?' selected':''}>Yes</option><option value="no"${st==='no'?' selected':''}>No</option></select><span class="stock-print">${st==='no'?'No':'Yes'}</span>`;})()}</td>
      <td class="num"><input class="unitc" type="number" min="0" step="0.01" value="${l.unit}" data-f="unit"><span class="unit-print">${money(l.unit)}</span></td>
      <td class="num linetot">${money((Number(l.qty)||0)*(Number(l.unit)||0))}</td>
      <td class="noprint"><button class="rmbtn" title="Remove" data-rm="${l.id}">✕</button></td>
    </tr>`).join("");

  body.querySelectorAll("input,select").forEach(inp=>{
    inp.oninput = e=>{
      const id = e.target.closest("tr").dataset.id;
      const line = quote.lines.find(x=>x.id===id); if(!line) return;
      const f = e.target.dataset.f;
      const isText = (f==="desc" || f==="code" || f==="stock");
      line[f] = isText ? e.target.value : (parseFloat(e.target.value)||0);
      if(!isText){
        e.target.closest("tr").querySelector(".linetot").textContent =
          money((Number(line.qty)||0)*(Number(line.unit)||0));
        renderTotals();
      }
      saveQuote();
    };
  });
  body.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick = ()=>{ quote.lines = quote.lines.filter(x=>x.id!==b.dataset.rm); saveQuote(); renderLines(); };
  });
  renderTotals();
}
function renderTotals(){
  const t = computeTotals(quote);
  $("tSub").textContent = money(t.sub);
  $("tDelivPrint").textContent = money(t.deliv);
  $("tVat").textContent = money(t.vat);
  $("vatLine").classList.toggle("vatoff", !quote.vatOn);   // hidden on print when off
  $("qVatRate").disabled = !quote.vatOn;
  $("tGrand").textContent = money(t.grand);
}
function addLine(desc="",unit=0,qty=1,code=""){
  quote.lines.push({id:uid(), qty, desc, unit, code, stock:"yes"});
  saveQuote(); renderLines();
}

  const sel = $("catPick");

    sorted.map(c=>`<option value="${c.id}">${esc(c.desc)} — ${money(c.unit)}${c.standard?" ⭐":""}</option>`).join("");

/* ---------- image downscale (for the company logo) ---------- */
function downscaleImage(file, maxW, maxH){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("bad image"));
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width, maxH/img.height);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ resolve(c.toDataURL("image/png")); }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- saved quotes library ---------- */
const quoteName = q => (q.ref || q.customer || q.project || "Untitled quote").trim() || "Untitled quote";

function saveCurrentQuote(){
  if(!quote.lines.length && !quote.customer && !quote.ref){ toast("Nothing to save yet"); return; }
  // consume the auto number on first save, only if the ref is still the untouched preview
  if(!quote.savedId && quote.ref === previewRef()){
    nextSeq++; saveSeq(); schedulePush();
  }
  quote.updated = Date.now();
  const snapshot = JSON.parse(JSON.stringify(quote));
  if(quote.savedId){
    const i = savedQuotes.findIndex(x=>x.savedId===quote.savedId);
    if(i>=0){ savedQuotes[i] = snapshot; saveQuotes(); toast(`Updated “${quoteName(snapshot)}”`); return; }
  }
  snapshot.savedId = uid(); snapshot.created = Date.now();
  quote.savedId = snapshot.savedId;
  savedQuotes.push(snapshot); saveQuotes(); saveQuote();
  toast(`Saved “${quoteName(snapshot)}”`);
}
function openQuotesList(){
  const rows = [...savedQuotes].sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));
  $("modalRoot").innerHTML = `
  <div class="overlay" id="overlay">
    <div class="modal" style="max-width:560px">
      <h2>📁 Saved quotes</h2>
      <p style="color:var(--muted);font-size:13px;margin:-8px 0 16px;line-height:1.5">
        ${rows.length ? "Open a quote to load it into the editor. Stored on this device."

      </div>

  bindOverlayClose();
  const box = $("quoteListBox");
  box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSavedQuote(b.dataset.open));
  box.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>duplicateSaved(b.dataset.dup));

function quoteRowHtml(q){
  const t = computeTotals(q);
  const when = q.date ? new Date(q.date).toLocaleDateString("en-GB") : "";
  const sub = [q.customer, q.project, when].filter(Boolean).join("  ·  ") || "—";
  const cur = q.savedId===quote.savedId ? ' <span class="stdtag">open</span>' : "";
  return `<div class="catrow" data-id="${q.savedId}">
    <div class="cdesc"><div class="n">${esc(quoteName(q))}${cur}</div><div class="s">${esc(sub)}</div></div>
    <div class="cunit">${money(t.grand)}</div>
    <button class="icon" data-open="${q.savedId}" title="Open">📂</button>
    <button class="icon" data-dup="${q.savedId}" title="Duplicate">⧉</button>
    <button class="icon" data-del="${q.savedId}" title="Delete">🗑</button>
  </div>`;
}
function openSavedQuote(id){
  const q = savedQuotes.find(x=>x.savedId===id); if(!q) return;
  quote = fixQuote(JSON.parse(JSON.stringify(q)));
  quote.savedId = id;
  saveQuote(); bindQuoteFields(); renderLines(); closeModal();
  toast(`Opened “${quoteName(quote)}”`);
}
function duplicateSaved(id){
  const q = savedQuotes.find(x=>x.savedId===id); if(!q) return;
  const copy = fixQuote(JSON.parse(JSON.stringify(q)));
  copy.savedId = uid(); copy.created = copy.updated = Date.now();
  copy.ref = (q.ref||"") + " (copy)";
  savedQuotes.push(copy); saveQuotes(); openQuotesList();
  toast("Duplicated");
}
function deleteSaved(id){
  const q = savedQuotes.find(x=>x.savedId===id); if(!q) return;
  if(!confirm(`Delete “${quoteName(q)}”? This can't be undone.`)) return;
  savedQuotes = savedQuotes.filter(x=>x.savedId!==id);
  if(quote.savedId===id){ quote.savedId=null; saveQuote(); }
  saveQuotes(); openQuotesList(); toast("Deleted");
}

  $("printFoot").innerHTML = (foot ? esc(foot)+"<br>" : "") +
    "This quotation is valid for 30 days from the date above. Prices in GBP. E&amp;OE.";
  // static VAT rate for print + refresh rows so unit prices show formatted £ values
  document.querySelector(".vatrate-print").textContent = (Number(quote.vatRate)||0);
  renderLines();
  window.print();
}

/* ---------- backup / restore ---------- */
function exportBackup(){
  const payload = { app:"door-hardware-quote", version:4, exported:new Date().toISOString(),
                    catalogue, quote, savedQuotes, company, seq:nextSeq };
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `door-quote-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
}
async function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  let data; try{ data = JSON.parse(await file.text()); }
  catch{ toast("Couldn't read that file"); return; }
  if(data.app !== "door-hardware-quote"){ toast("Not a Door Hardware Quote backup"); return; }
  if(Array.isArray(data.catalogue)) catalogue = data.catalogue;
  if(data.quote && typeof data.quote==="object") quote = fixQuote(data.quote);
  if(Array.isArray(data.savedQuotes)) savedQuotes = data.savedQuotes.map(fixQuote);
  if(data.company && typeof data.company==="object") company = data.company;
  if(typeof company.quotePrefix !== "string") company.quotePrefix = "Q-";
  if(typeof company.defaultDelivery !== "number") company.defaultDelivery = 30;
  if(Number.isFinite(data.seq) && data.seq>0) nextSeq = data.seq;
  saveSeq(); saveCat(); saveQuote(); saveQuotes(); saveCo(); bindQuoteFields(); fillCatPick(); renderLines();
  toast("Backup restored");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove("show"); t.textContent=""; },2400);
}

/* ---------- view preferences: theme + text size (local, not synced) ---------- */
const LS_THEME = "dhq.theme", LS_SCALE = "dhq.scale";
let theme = "dark", scale = 1;
const SCALES = [0.85, 1, 1.15, 1.3, 1.5];
function loadPrefs(){
  try{ theme = localStorage.getItem(LS_THEME) === "light" ? "light" : "dark"; }catch{ theme = "dark"; }
  let s; try{ s = parseFloat(localStorage.getItem(LS_SCALE)); }catch{ s = NaN; }

}
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  const b = $("themeBtn"); if(b){ b.textContent = theme === "light" ? "☀" : "🌙"; b.title = theme==="light"?"Switch to dark":"Switch to light"; }
}
function toggleTheme(){ theme = theme==="light" ? "dark" : "light"; try{ localStorage.setItem(LS_THEME, theme); }catch(e){} applyTheme(); }
function applyScale(){
  document.documentElement.style.setProperty("--scale", scale);
  const d=$("tsDown"), u=$("tsUp");
  if(d) d.disabled = scale <= SCALES[0];
  if(u) u.disabled = scale >= SCALES[SCALES.length-1];
}
function stepScale(dir){
  const i = SCALES.indexOf(scale); if(i<0){ scale=1; }
  const ni = Math.min(SCALES.length-1, Math.max(0, (i<0?1:i)+dir));
  scale = SCALES[ni]; try{ localStorage.setItem(LS_SCALE, String(scale)); }catch(e){}
  applyScale();
}

/* ============================================================
   GitHub Gist sync + encrypted cloud copy  (adapted from IdeaPad)
   Syncs the durable data: catalogue, saved quotes, company.
   The working quote stays local. Cloud copy is encrypted with a
   passphrase (PBKDF2 200k -> AES-GCM 256); on-device data is plain.
============================================================ */
const GH = {
  get token(){ try{return localStorage.getItem("dhq.gh.token")||""}catch(e){return ""} },
  get gist(){ try{return localStorage.getItem("dhq.gh.gist")||""}catch(e){return ""} },
  get auto(){ try{return localStorage.getItem("dhq.gh.auto")!=="0"}catch(e){return true} },
  get user(){ try{return localStorage.getItem("dhq.gh.user")||""}catch(e){return ""} },
  get pass(){ try{return localStorage.getItem("dhq.gh.pass")||""}catch(e){return ""} },
  set token(v){ try{v?localStorage.setItem("dhq.gh.token",v):localStorage.removeItem("dhq.gh.token")}catch(e){} },
  set gist(v){ try{v?localStorage.setItem("dhq.gh.gist",v):localStorage.removeItem("dhq.gh.gist")}catch(e){} },
  set auto(v){ try{localStorage.setItem("dhq.gh.auto",v?"1":"0")}catch(e){} },
  set user(v){ try{v?localStorage.setItem("dhq.gh.user",v):localStorage.removeItem("dhq.gh.user")}catch(e){} },
  set pass(v){ try{v?localStorage.setItem("dhq.gh.pass",v):localStorage.removeItem("dhq.gh.pass")}catch(e){} },
  get connected(){ return !!(this.token && this.gist); }
};
const GIST_FILE = "doorquote.json";
const GIST_DESC = "Door Hardware Quote sync";
let SYNC_PASS = GH.pass;

/* ---- crypto ---- */
const _enc=new TextEncoder(), _dec=new TextDecoder();
const _b64={ enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))), dec:str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0)) };
async function _deriveKey(pass, salt){
  const base=await crypto.subtle.importKey("raw", _enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
function buildSyncDoc(){ return { app:"door-hardware-quote", updatedAt:Date.now(), catalogue, savedQuotes, company, seq:nextSeq }; }
async function encodeForGist(){
  const plain = JSON.stringify(buildSyncDoc());
  if(!SYNC_PASS) return plain;
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(SYNC_PASS, salt);
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, _enc.encode(plain));
  return JSON.stringify({ __enc:1, alg:"AES-GCM-PBKDF2-200k", salt:_b64.enc(salt), iv:_b64.enc(iv), data:_b64.enc(cipher), updatedAt:Date.now() });
}
async function decodeEnvelope(env){
  const key=await _deriveKey(SYNC_PASS, _b64.dec(env.salt));
  const plain=await crypto.subtle.decrypt({name:"AES-GCM", iv:_b64.dec(env.iv)}, key, _b64.dec(env.data));
  return JSON.parse(_dec.decode(plain));
}

/* ---- status text (only shown while the Sync modal is open) ---- */
function markSync(msg, err){ const m=$("syncMsg"); if(m){ m.textContent = msg||""; m.style.color = err?"var(--danger)":"var(--muted)"; } }
function setSyncTime(){ try{ localStorage.setItem("dhq.gh.lastSync", String(Date.now())); }catch(e){} updateLastSync(); }
function updateLastSync(){
  let t=0; try{ t=Number(localStorage.getItem("dhq.gh.lastSync"))||0; }catch(e){}
  const rel = !t ? "never" : (()=>{ const s=Math.round((Date.now()-t)/1000);
    return s<10?"just now" : s<60?s+"s ago" : s<3600?Math.round(s/60)+" min ago" : s<86400?Math.round(s/3600)+"h ago" : new Date(t).toLocaleString(); })();
  const el=$("syncLast"); if(el) el.textContent = rel;
  const b=$("syncBtn"); if(b) b.textContent = GH.connected ? (SYNC_PASS?"☁ Sync 🔒":"☁ Sync ✓") : "☁ Sync";
}
setInterval(updateLastSync, 30000);

/* ---- rate-limit backoff ---- */
let syncPausedUntil = 0, pendingPush = false;
function syncPaused(){ return Date.now() < syncPausedUntil; }
function retryAfterSecs(res){
  const ra = res.headers.get("Retry-After");
  if(ra){ const n=parseInt(ra,10); if(n>0) return Math.min(3600, Math.max(30,n)); }
  const reset = res.headers.get("X-RateLimit-Reset");
  if(reset){ const ms = parseInt(reset,10)*1000 - Date.now(); if(ms>0) return Math.min(3600, Math.ceil(ms/1000)); }
  return 90;
}
function pauseSync(secs){ syncPausedUntil = Date.now() + secs*1000; markSync("Rate-limited — paused "+secs+"s", true); }

async function ghApi(method, path, body){
  let res;
  try{
    res = await fetch("https://api.github.com"+path, {
      method,
      headers:{ "Authorization":"Bearer "+GH.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
  }catch(e){ throw new Error("Can't reach GitHub — if you opened the file directly (file://), serve it over http/https instead."); }
  if(!res.ok){
    let detail=""; try{ detail=(await res.json()).message||""; }catch(e){}
    if(res.status===403 || res.status===429) pauseSync(retryAfterSecs(res));
    if(res.status===401) throw new Error("Invalid or expired token (401). Create a new classic token with gist scope.");
    if(res.status===403) throw new Error("Forbidden (403) — token missing 'gist' scope, or rate-limited."+(detail?" "+detail:""));
    if(res.status===404) throw new Error("Not found (404) — wrong Gist ID, or a fine-grained token (gists need a CLASSIC token).");
    throw new Error("GitHub "+res.status+(detail?" — "+detail:""));
  }
  return res.json();
}

let pushTimer=null;
function schedulePush(){
  if(!GH.connected || !GH.auto) return;
  if(syncPaused()){ pendingPush=true; return; }
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ syncPush().then(()=>{ pendingPush=false; }).catch(e=>{ pendingPush=true; if(!syncPaused()) markSync("Push failed: "+e.message, true); }); }, 1500);
}
async function syncPush(){
  if(!GH.connected) return;
  markSync("Saving…");
  const content=await encodeForGist();
  await ghApi("PATCH","/gists/"+GH.gist, {files:{[GIST_FILE]:{content}}});
  setSyncTime(); markSync(SYNC_PASS?"Synced 🔒":"Synced");
}

/* ---- merge remote into local (union by id; newer 'updated' wins) ---- */
function _sig(){ return JSON.stringify([catalogue, savedQuotes, company, nextSeq]); }
function mergeSync(remote){
  const before=_sig();
  const cat={}; catalogue.forEach(c=>{ if(c&&c.id) cat[c.id]=c; });
  (remote.catalogue||[]).forEach(rc=>{ if(!rc||!rc.id) return; const l=cat[rc.id]; if(!l || (rc.updated||0)>(l.updated||0)) cat[rc.id]=rc; });
  catalogue = Object.values(cat);
  const sq={}; savedQuotes.forEach(q=>{ if(q&&q.savedId) sq[q.savedId]=q; });
  (remote.savedQuotes||[]).forEach(rq=>{ if(!rq||!rq.savedId) return; const l=sq[rq.savedId]; if(!l || (rq.updated||0)>(l.updated||0)) sq[rq.savedId]=fixQuote(rq); });
  savedQuotes = Object.values(sq);
  if(remote.company && (remote.company.updated||0) > (company.updated||0)) company = remote.company;
  if(Number.isFinite(remote.seq) && remote.seq > nextSeq){ nextSeq = remote.seq; saveSeq(); }
  _putCat(); _putQuotes(); _putCo();
  return _sig() !== before;
}

let gistEtag=null, pulling=false;
async function gistGet(){
  const headers = { "Authorization":"Bearer "+GH.token, "Accept":"application/vnd.github+json" };
  if(gistEtag) headers["If-None-Match"] = gistEtag;
  let res;
  try{ res = await fetch("https://api.github.com/gists/"+GH.gist, {headers, cache:"no-store"}); }
  catch(e){ throw new Error("Can't reach GitHub (offline?)."); }
  if(res.status===304) return {notModified:true};
  if(!res.ok){
    let detail=""; try{ detail=(await res.json()).message||""; }catch(e){}
    if(res.status===403 || res.status===429) pauseSync(retryAfterSecs(res));
    if(res.status===401) throw new Error("Invalid or expired token (401).");
    if(res.status===404) throw new Error("Gist not found (404).");
    throw new Error("GitHub "+res.status+(detail?" — "+detail:""));
  }
  gistEtag = res.headers.get("ETag") || gistEtag;
  return { data: await res.json() };
}
function refreshAfterSync(){
  fillCatPick(); renderLines();
  // keep a fresh, unsaved quote's auto-number in step with a synced counter/prefix
  if(!quote.savedId && !quote.lines.length && !quote.customer && /^\D*\d+$/.test(quote.ref||"")){
    quote.ref = previewRef(); saveQuote(); const el=$("qRef"); if(el) el.value = quote.ref;
  }
}
async function syncPull(force, quiet){
  if(!GH.connected) return;
  if(pulling && quiet) return;
  pulling = true;
  if(!quiet) markSync("Checking…");
  try{
    const r = await gistGet();
    if(r.notModified){ setSyncTime(); if(!quiet) markSync("Up to date"); return "uptodate"; }
    const f = r.data.files && r.data.files[GIST_FILE];
    if(!f || !f.content){ if(!quiet) markSync("Connected — no data in this gist yet"); return "empty"; }
    let remote, wasEnc=false;
    try{ remote = JSON.parse(f.truncated && f.raw_url ? await (await fetch(f.raw_url)).text() : f.content); }
    catch(e){ if(!quiet) markSync("Sync data unreadable", true); return "error"; }
    if(remote && remote.__enc===1){
      wasEnc=true;
      if(!SYNC_PASS){ if(!quiet) markSync("This sync is encrypted — set your passphrase below to unlock it.", true); return "locked"; }
      try{ remote = await decodeEnvelope(remote); }
      catch(e){ if(!quiet) markSync("Wrong passphrase — your local data was kept.", true); return "badpass"; }
    }
    const changed = mergeSync(remote);
    if(!wasEnc && SYNC_PASS) schedulePush();     // plaintext gist -> re-encrypt on next push
    if(force || changed){ refreshAfterSync(); setSyncTime(); if(changed && !quiet) markSync("Pulled latest changes"); }
    else if(!quiet){ setSyncTime(); markSync("Up to date"); }
    return changed ? "pulled" : "uptodate";
  } finally { pulling=false; }
}
async function findQuoteGist(){
  const list = await ghApi("GET","/gists?per_page=100");
  const mine = (list||[]).filter(g => (g.files && g.files[GIST_FILE]) || g.description===GIST_DESC);
  if(!mine.length) return null;
  mine.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  return mine[0].id;
}
async function fetchUser(){
  try{ const u = await ghApi("GET","/user"); GH.user = u.login; const el=$("syncUser"); if(el) el.textContent = u.login; }catch(e){}
}
async function doSyncNow(){
  try{ await syncPull(false); await syncPush(); updateLastSync(); toast("Synced"); }
  catch(e){ markSync("Sync failed: "+e.message, true); toast("Sync failed"); }
}
function autoPull(){
  if(!GH.connected || !GH.auto || document.hidden || syncPaused()) return;
  syncPull(false, true).then(r=>{ if(r) updateLastSync(); if(pendingPush) schedulePush(); }).catch(()=>{});
}
setInterval(autoPull, 30000);
let lastFgPull=0;
function foregroundPull(){ const t=Date.now(); if(t-lastFgPull<8000) return; lastFgPull=t; autoPull(); }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) foregroundPull(); });
window.addEventListener("focus", foregroundPull);

/* ---- sync modal ---- */
function openSync(){
  const conn = GH.connected;
  $("modalRoot").innerHTML = `
  <div class="overlay" id="overlay">
    <div class="modal" style="max-width:520px">
      <h2>☁ Sync across devices</h2>
      <div id="syncDisconnected" ${conn?'style="display:none"':''}>
        <p style="color:var(--muted);font-size:13px;margin:-8px 0 14px;line-height:1.5">
          Keep your catalogue and saved quotes on every device via a <b>private</b> GitHub gist.
          Create a token with only the <b>gist</b> scope and paste it on each device — it finds your
          shared sync automatically. Your token is stored only in this browser.</p>
        <div class="field"><label>GitHub token <span style="color:var(--faint);font-weight:400">— classic, gist scope</span></label>
          <div class="pwrow"><input id="ghToken" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false" style="flex:1">
          <button class="icon" type="button" id="ghShowToken" title="Show/hide">👁</button></div></div>
        <div class="field"><label>Gist ID <span style="color:var(--faint);font-weight:400">— optional, leave blank to auto-find/create</span></label>
          <input id="ghGist" placeholder="(auto)"></div>
        <p style="font-size:12px;margin:0 0 14px"><a class="tlink" href="https://github.com/settings/tokens/new?scopes=gist&description=Door%20Quote%20sync" target="_blank" rel="noopener">Create a token →</a> — use a <b>classic</b> token, tick only <b>gist</b>. (Fine-grained tokens can't access gists.)</p>
        <div class="modal-actions"><button class="link" onclick="closeModal()">Cancel</button>
          <button class="primary flex1" id="ghConnect">Connect</button></div>
      </div>
      <div id="syncConnected" ${conn?'':'style="display:none"'}>
        <div class="catrow" style="margin-bottom:12px">
          <div class="cdesc"><div class="n">Connected as <b id="syncUser">${esc(GH.user||"…")}</b></div>
            <div class="s">Gist <span id="syncGistId">${esc(GH.gist)}</span> · synced <span id="syncLast">—</span></div></div>
          <button class="icon" id="ghCopyGist" title="Copy Gist ID">📋</button>
        </div>
        <label class="cbrow" style="margin-bottom:10px"><input type="checkbox" id="ghAuto"> <span style="color:var(--text);font-size:14px">Auto-sync in the background</span></label>
        <div style="border-top:1px solid var(--line);margin:12px 0"></div>
        <div style="font-size:13px;margin-bottom:8px">Cloud encryption: <b id="encStatus"></b></div>
        <p style="color:var(--muted);font-size:12px;margin:0 0 10px;line-height:1.5">
          Encrypts the copy stored in the gist so it can't be read without this passphrase.
          Use the <b>same</b> passphrase on every device. <b>No recovery</b> if you forget it — keep a Backup.</p>
        <div class="field"><div class="pwrow">
          <input id="ghPass" type="password" placeholder="Sync passphrase" autocomplete="off" style="flex:1">
          <button class="icon" type="button" id="ghPassShow" title="Show/hide">👁</button></div></div>
        <div class="modal-actions" style="margin-bottom:6px">
          <button class="btn" id="ghPassClear">Remove encryption</button>
          <button class="btn accent flex1" id="ghPassSet">Encrypt cloud copy</button>
        </div>
        <div style="border-top:1px solid var(--line);margin:12px 0"></div>
        <div class="modal-actions">
          <button class="link danger" id="ghDisconnect">Disconnect</button>
          <button class="link" onclick="closeModal()">Close</button>
          <button class="primary flex1" id="ghSyncNow">Sync now</button>
        </div>
      </div>
      <div class="err" id="syncMsg" style="min-height:18px;margin-top:12px"></div>
    </div>
  </div>`;
  bindOverlayClose();
  if(conn){ $("ghAuto").checked = GH.auto; renderEnc(); updateLastSync(); if(!GH.user) fetchUser(); wireSyncConnected(); }
  else wireSyncDisconnected();
}
window.openSync = openSync;
function renderEnc(){
  const s=$("encStatus"); if(s){ s.textContent = SYNC_PASS?"On 🔒":"Off — cloud copy is plain text"; s.style.color = SYNC_PASS?"var(--accent2)":"var(--danger)"; }
  const setb=$("ghPassSet"); if(setb) setb.textContent = SYNC_PASS?"Update passphrase":"Encrypt cloud copy";
  const clr=$("ghPassClear"); if(clr) clr.style.display = SYNC_PASS?"":"none";
}
function wireSyncDisconnected(){
  $("ghShowToken").onclick = ()=>{ const i=$("ghToken"); i.type=i.type==="password"?"text":"password"; };
  $("ghConnect").onclick = async ()=>{
    const t=$("ghToken").value.trim(); let gid=$("ghGist").value.trim();
    if(!t){ markSync("Paste your GitHub token first.", true); return; }
    GH.token=t; markSync("Connecting…");
    try{
      if(!gid) gid = await findQuoteGist();
      if(gid){
        GH.gist=gid;
        const r = await syncPull(true);
        if(r==="empty"){ await syncPush(); markSync(SYNC_PASS?"Connected — seeded this gist (encrypted 🔒).":"Connected — seeded this gist."); }
        else if(r==="locked"){ markSync("Connected — this sync is encrypted. Set your passphrase below.", true); }
        else if(r==="badpass"){ markSync("Connected, but that passphrase doesn't match. Update it below.", true); }
        else { await syncPush(); markSync("Connected — merged with your existing sync."); }
      } else {
        const content = await encodeForGist();
        const g = await ghApi("POST","/gists",{description:GIST_DESC, public:false, files:{[GIST_FILE]:{content}}});
        GH.gist=g.id; setSyncTime(); markSync(SYNC_PASS?"Connected — new encrypted sync created 🔒.":"Connected — new sync created.");
      }
      fetchUser(); updateLastSync(); openSync();
    }catch(e){ GH.token=""; GH.gist=""; GH.user=""; markSync("Couldn't connect: "+e.message, true); }
  };
}
function wireSyncConnected(){
  $("ghSyncNow").onclick = doSyncNow;
  $("ghAuto").onchange = ()=>{ GH.auto = $("ghAuto").checked; if(GH.auto) schedulePush(); };
  $("ghCopyGist").onclick = ()=>{ (navigator.clipboard?navigator.clipboard.writeText(GH.gist):Promise.reject()).then(()=>toast("Gist ID copied"), ()=>toast(GH.gist)); };
  $("ghPassShow").onclick = ()=>{ const i=$("ghPass"); i.type=i.type==="password"?"text":"password"; };
  $("ghDisconnect").onclick = ()=>{ if(confirm("Disconnect sync on this device? Your data stays here; the gist is untouched.")){ GH.token=""; GH.gist=""; GH.user=""; toast("Disconnected"); openSync(); } };
  $("ghPassSet").onclick = async ()=>{
    const p=$("ghPass").value;
    if(!p){ markSync("Enter a passphrase first.", true); return; }
    if(p.length<6){ markSync("Use at least 6 characters.", true); return; }
    SYNC_PASS=p; GH.pass=p; $("ghPass").value=""; renderEnc();
    markSync("Applying passphrase…");
    try{ const r=await syncPull(true);
      if(r==="badpass"){ markSync("That passphrase doesn't match your existing encrypted sync — local data kept.", true); return; }
      await syncPush(); markSync("Cloud copy is now encrypted 🔒"); toast("Cloud copy encrypted"); updateLastSync();
    }catch(e){ markSync("Couldn't update the gist: "+e.message, true); }
  };
  $("ghPassClear").onclick = async ()=>{
    if(!confirm("Remove cloud encryption? On the next sync your data is written to the gist as PLAIN TEXT.")) return;
    SYNC_PASS=""; GH.pass=""; renderEnc();
    try{ await syncPush(); markSync("Cloud encryption removed."); updateLastSync(); }
    catch(e){ markSync("Couldn't update the gist: "+e.message, true); }
  };
}

/* ---------- wire up ---------- */
loadPrefs();
applyTheme();
applyScale();
loadAll();
bindQuoteFields();
maybePrefillRef();
fillCatPick();
renderLines();
$("themeBtn").onclick = toggleTheme;
$("tsDown").onclick = ()=>stepScale(-1);
$("tsUp").onclick = ()=>stepScale(1);

$("printBtn").onclick = doPrint;
