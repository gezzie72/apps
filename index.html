<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Apps</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e7e9ee; --muted:#98a0ae; }
  @media (prefers-color-scheme:light){ :root{ --bg:#f4f5f8; --panel:#fff; --line:#dfe3ea; --text:#1b1f27; --muted:#5a6473; } }
  *{box-sizing:border-box}
  body{margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:28px}
  h1{margin:0; font-size:22px; letter-spacing:.3px}
  p{margin:0; color:var(--muted); text-align:center; max-width:340px}
  .apps{display:flex; flex-wrap:wrap; gap:16px; justify-content:center}
  a.card{display:flex; flex-direction:column; align-items:center; gap:10px; text-decoration:none; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px 26px; width:150px}
  a.card:hover{border-color:#6ea8fe}
  .ic{width:72px; height:72px; border-radius:18px}
  .name{font-weight:600}
</style>
</head>
<body>
  <h1>My Apps</h1>
  <div class="apps">
    <a class="card" href="financemanager/"><img class="ic" src="financemanager/icon-192.png" alt="Finance Manager"><span class="name">Finance Manager</span></a>
    <a class="card" href="ideapad/"><img class="ic" src="ideapad/icon-192.png" alt="IdeaPad"><span class="name">IdeaPad</span></a>
    <a class="card" href="fitplan/"><img class="ic" src="fitplan/icon-192.png" alt="FitPlan"><span class="name">FitPlan</span></a>
    <a class="card" href="fitcoach/"><img class="ic" src="fitcoach/icon-192.png" alt="MyFitCoach"><span class="name">MyFitCoach</span></a>
    <a class="card" href="healthlog/"><img class="ic" src="healthlog/icon-192.png" alt="HealthLog"><span class="name">HealthLog</span></a>
    <a class="card" href="vault/"><img class="ic" src="vault/icon-192.png" alt="Vault"><span class="name">Vault</span></a>
    <a class="card" href="recipebox/"><img class="ic" src="recipebox/icon-192.png" alt="RecipeBox"><span class="name">RecipeBox</span></a>
    <a class="card" href="officereport/"><img class="ic" src="officereport/icon-192.png" alt="Office Report"><span class="name">Office Report</span></a>
    <a class="card" href="shopfloorreport/"><img class="ic" src="shopfloorreport/icon-192.png" alt="Shopfloor Report"><span class="name">Shopfloor Report</span></a>
    <a class="card" href="masticcalc/"><img class="ic" src="masticcalc/icon-192.png" alt="Mastic Calc"><span class="name">Mastic Calc</span></a>
    <a class="card" href="qualityreport/"><img class="ic" src="qualityreport/icon-192.png" alt="Quality Report"><span class="name">Quality Report</span></a>
    <a class="card" href="rp193/"><img class="ic" src="rp193/icon-192.png" alt="RP193 Calc"><span class="name">RP193 Calc</span></a>
  </div>
  <p>Open an app, then use your browser menu → <b>Install app</b> / <b>Add to Home screen</b>.</p>
</body>
</html>
